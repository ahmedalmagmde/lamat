<style>

*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth;scroll-padding-top:84px}
body{background:var(--bg);color:var(--ink);font-family:Tajawal,Tahoma,sans-serif;overflow-x:hidden}
header.nav{position:fixed;top:env(safe-area-inset-top,0px);inset-inline:0;z-index:50;display:flex;align-items:center;justify-content:space-between;padding:12px 5vw;background:var(--hd);backdrop-filter:blur(14px);transition:padding .4s,box-shadow .4s,transform .45s cubic-bezier(.2,.9,.2,1)}

.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--acc);font-family:'Reem Kufi',serif;font-size:1.5rem}

@keyframes up{from{opacity:0;transform:translateY(30px)}}@keyframes float{50%{transform:translateY(-14px)}}
@keyframes spin{to{rotate:360deg}}
@keyframes morph{0%,100%{border-radius:60% 40% 30% 70%/60% 30% 70% 40%}50%{border-radius:30% 60% 70% 40%/50% 60% 30% 60%}}

.hero .hc{position:relative;z-index:2;max-width:760px}
.hero h1{color:var(--acc2);font-size:clamp(2.8rem,8vw,5.6rem);text-shadow:0 4px 30px rgba(0,0,0,.45)}.hero h1 span{color:#fff}
.hero p{color:rgba(255,255,255,.88);margin-inline:auto;max-width:620px}
.hero .btns{justify-content:center}.hero .btn.o{color:#fff;border-color:#fff}
.wave{z-index:3}
.phone{display:none}
.snd{position:absolute;z-index:5;bottom:96px;inset-inline-end:18px;width:46px;height:46px;padding:0;border-radius:50%;border:1px solid rgba(255,255,255,.4);background:rgba(18,12,10,.5);color:#fff;display:grid;place-items:center;cursor:pointer;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);transition:.3s}

@media(max-width:800px){.hero{min-height:100svh}.hero .bgv{filter:none;transform:none}.phone{display:block;position:static;width:0;height:0}.phone video{display:none}}
@media(min-width:801px){
.hero{grid-template-columns:1.1fr .9fr;text-align:start;justify-items:stretch;gap:48px}
.hero .hc{justify-self:center}.hero p{margin-inline:0}.hero .btns{justify-content:flex-start}

.phone{display:block;position:relative;z-index:2;justify-self:center;height:min(72vh,660px);aspect-ratio:9/16;border-radius:34px;overflow:hidden;border:6px solid rgba(255,255,255,.92);box-shadow:0 30px 80px rgba(0,0,0,.55),0 0 60px rgba(232,87,42,.35)}
.phone video{width:100%;height:100%;object-fit:cover;display:block}
.phone .snd{bottom:14px;inset-inline-end:14px}}
.pp{display:none;position:absolute;z-index:5;left:50%;bottom:120px;transform:translateX(-50%);width:76px;height:76px;border-radius:50%;border:0;background:rgba(255,255,255,.9);color:var(--acc);font-size:1.8rem;place-items:center;cursor:pointer;box-shadow:0 10px 30px rgba(0,0,0,.45);animation:pulse 2s infinite}
@media print{body{display:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.rv{opacity:1;transform:none}}
</style>
</head>

<script>
const LOGO="assets/logo.jpg",IMG="assets/menu.jpg";
try{history.scrollRestoration='manual'}catch(e){}
try{if(location.hash)history.replaceState(null,'',location.pathname+location.search)}catch(e){}
const top0=()=>scrollTo({top:0,left:0,behavior:'instant'});top0();addEventListener('load',()=>{top0();setTimeout(top0,80)});addEventListener('pageshow',top0);
document.querySelectorAll('[data-l]').forEach(i=>i.src=LOGO);
function draw(cv,w){const im=new Image();im.onload=()=>{const h=Math.round(im.height*w/im.width);cv.width=w;cv.height=h;const g=cv.getContext('2d');g.drawImage(im,0,0,w,h);g.save();g.globalAlpha=.07;g.fillStyle='#e04e24';g.font='bold '+Math.round(w/16)+'px sans-serif';g.rotate(-.5);for(let y=-w;y<h+w;y+=w/4)for(let x=-w;x<w*1.6;x+=w/2.2)g.fillText('Lamat',x+(y%2?60:0),y);g.restore()};im.src=IMG}
draw(document.getElementById('c1'),1100);
const lb=document.getElementById('lb');let ok=0;
document.getElementById('open').onclick=()=>{if(!ok){draw(document.getElementById('c2'),1100);ok=1}lb.classList.add('on');document.body.style.overflow='hidden'};
const cl=()=>{lb.classList.remove('on');document.body.style.overflow=''};document.getElementById('x').onclick=cl;
['contextmenu','dragstart','copy','cut','selectstart'].forEach(e=>document.addEventListener(e,ev=>{if(ev.target.closest&&ev.target.closest('.in,#lb'))ev.preventDefault()}));
addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&['s','p','u'].includes(e.key.toLowerCase()))e.preventDefault();if(e.key==='Escape')cl()});
const nav=document.getElementById('nav'),links=document.getElementById('links');
addEventListener('scroll',()=>nav.classList.toggle('s',scrollY>30),{passive:true});
document.getElementById('mb').onclick=()=>links.classList.toggle('open');
links.querySelectorAll('a').forEach(a=>a.addEventListener('click',()=>links.classList.remove('open')));

document.querySelectorAll('.rv').forEach(e=>io.observe(e));
const sec=[...links.querySelectorAll('a:not(.cta)')],tg=['.hero','#menu','#contact'].map(q=>document.querySelector(q));
const ind=document.createElement('span');ind.className='ind';links.prepend(ind);let cur=0,init=0;
function upd(){const a=sec[cur];ind.style.width=a.offsetWidth+'px';ind.style.height=a.offsetHeight+'px';ind.style.top=a.offsetTop+'px';ind.style.transform='translateX('+a.offsetLeft+'px)'}
function pick(){let i=0;tg.forEach((el,k)=>{if(el.getBoundingClientRect().top<=innerHeight*.4)i=k});if(innerHeight+scrollY>=document.documentElement.scrollHeight-6)i=tg.length-1;
if(i!==cur||!init){cur=i;init=1;sec.forEach((a,k)=>a.classList.toggle('on',k===i));upd()}}
addEventListener('scroll',()=>requestAnimationFrame(pick),{passive:true});addEventListener('resize',()=>{pick();upd()});
window.upd=upd;pick();setTimeout(upd,300);if(document.fonts)document.fonts.ready.then(upd);

const L=[['.brand span','Lamat'],['.links a:nth-of-type(1)','Home'],['.links a:nth-of-type(2)','Menu'],['.links a:nth-of-type(3)','Contact'],['.links a:nth-of-type(4)','Order Here'],
['.hero h1','Coffee that <span>gathers</span> loved ones'],['.hero p','Specialty coffee and premium desserts in a cozy atmosphere. Order your favorite drink with ease.'],
['.btns a:nth-child(1)','Order Here'],['.btns a:nth-child(2)','Menu'],['#menu h2','Our Menu'],['#menu .hint','Tap the menu to view it full size'],['#contact h2','Social Media'],['footer','© Lamat Coffee']];
const S=['WhatsApp','Instagram','TikTok','Snapchat','Our Location'],soc=[...document.querySelectorAll('.soc a')];
const els=L.map(([q,e])=>[document.querySelector(q),e]);
els.forEach(([el])=>el.dataset.ar=el.innerHTML);soc.forEach(a=>a.dataset.ar=a.lastChild.nodeValue);
const TT={ar:document.title,en:'Lamat Coffee | Specialty Coffee & Desserts'};
function setLang(l){const en=l==='en';document.documentElement.lang=l;document.documentElement.dir=en?'ltr':'rtl';

(function(){const vb=document.getElementById('hv'),vf=document.getElementById('hf'),hero=document.querySelector('.hero'),pp=document.getElementById('pp'),snd=document.getElementById('snd');
const small=matchMedia('(max-width:800px)').matches,touch=matchMedia('(pointer:coarse)').matches;
if(!small)vf.src='assets/video.mp4';
let unlocked=false,inHero=true;
const vis=()=>vf.offsetParent!==null?vf:vb,has=v=>!!v.getAttribute('src');
function upd(){const m=vis().muted;snd.classList.toggle('off',m);snd.setAttribute('aria-label',m?'Unmute':'Mute')}
function apply(){vb.muted=true;vf.muted=true;if(inHero&&unlocked)vis().muted=false;upd()}
function chk(){pp.style.display=(vis().paused&&inHero)?'grid':'none'}
const ev=['pointerdown','keydown','touchend','click'];
function unlock(e){if(e&&e.target&&e.target.closest&&e.target.closest('#snd'))return;unlocked=true;ev.forEach(e=>removeEventListener(e,unlock,true));apply();vb.play().catch(()=>{});if(has(vf))vf.play().catch(()=>{});setTimeout(chk,300)}
function listen(){ev.forEach(e=>addEventListener(e,unlock,true))}
vb.muted=true;vf.muted=true;vb.play().catch(()=>{});if(has(vf))vf.play().catch(()=>{});
if(small||touch)listen();else{const v=vis();v.muted=false;const p=v.play();
 if(p&&p.then)p.then(()=>{unlocked=true;apply()}).catch(()=>{v.muted=true;v.play().catch(()=>{});listen()});else listen()}
['playing','pause','play','volumechange'].forEach(e=>{vb.addEventListener(e,()=>{chk();upd()});vf.addEventListener(e,()=>{chk();upd()})});setTimeout(chk,1800);setTimeout(chk,4500);
pp.onclick=e=>{e.stopPropagation();unlock()};
snd.onclick=e=>{e.stopPropagation();if(vis().muted)unlock();else{unlocked=false;apply()}};upd();
new IntersectionObserver(e=>e.forEach(x=>{inHero=x.isIntersecting;if(inHero){vb.play().catch(()=>{});if(has(vf))vf.play().catch(()=>{})}else{vb.pause();vf.pause()}apply();chk()}),{threshold:.05}).observe(hero);
